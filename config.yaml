# ── Signal Intelligence Configuration ──

# News source: "newsapi" or "gdelt"
news_source: newsapi

# Curated RSS feeds (crypto/fintech outlets) — used in addition to news_source
news_rss_feeds:
  - name: coindesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
    weight: 5
  - name: cointelegraph
    url: https://cointelegraph.com/rss
    weight: 5
  - name: decrypt
    url: https://decrypt.co/feed
    weight: 4
  - name: yahoo_finance_top
    url: https://finance.yahoo.com/rss/topstories
    weight: 3
  - name: the_block
    url: https://www.theblock.co/rss.xml
    weight: 5

# Source weights for prioritization (higher = prefer when selecting top items)
source_weights:
  rss_news: 5
  coinmarketcal: 4
  fred: 4
  finnhub: 3
  x_trends: 3
  newsapi: 1
  gdelt: 1

# Max NewsAPI/GDELT items per run (curated RSS preferred)
news_headline_cap_per_source: 3

# Schedule (cron-style, SGT)
schedule:
  weekly: "0 8 * * 0"      # Sunday 8 AM
  daily: "0 8 * * 1-5"     # Mon-Fri 8 AM
  hourly: "0 */3 * * *"    # Every 3 hours

# Scoring thresholds
scoring:
  weights:
    price_impact: 30
    novelty: 20
    credibility: 30
    time_sensitivity: 20
  tiers:
    fyi: [0, 59]
    heads_up: [60, 79]
    actionable: [80, 100]
  enrichment_threshold: 40  # minimum score for LLM enrichment

# Chart gate
chart_gate:
  threshold: 70

# Cache
cache:
  ttl_seconds: 300
  dedup_window_hours: 48

# Regime tags (for reference; logic in regime.py)
regime_tags:
  - Risk-on
  - Risk-off
  - Trend
  - Chop
  - Squeeze
  - Breakdown

# Macro drivers tracked weekly
macro_drivers:
  - usd_strength    # DXY proxy
  - rates_yields    # real yields / fed funds
  - equities_risk   # SPX proxy via Finnhub
  - liquidity       # CB stance / M2 proxy
  - geopolitical    # shock events

# Fintech watchlist (Finnhub symbols)
fintech_watchlist:
  - COIN
  - SQ
  - MSTR
  - PYPL
  - HOOD
  - GRAB

# FRED series to track
fred_series:
  - DGS10       # 10Y yield
  - DTWEXBGS    # Dollar index
  - T10Y2Y      # 10-2 spread
  - ICSA        # Initial claims
  - CPIAUCSL    # CPI
  - FEDFUNDS    # Fed funds rate
  - DGS2        # 2Y yield (real yield proxy)

# News keywords for filtering
news_keywords:
  crypto:
    - bitcoin
    - btc
    - crypto
    - ethereum
    - stablecoin
    - defi
    - web3
  fintech:
    - fintech
    - digital payments
    - neobank
    - BNPL
    - blockchain
    - cbdc
